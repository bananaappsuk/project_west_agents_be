name: Build and Deploy to Render

on:
  push:
    branches: [white-label]

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/project-west-agent

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: auth
            dockerfile: services/auth/Dockerfile
            deploy_hook: ""   # paste auth's Render deploy hook URL here
          - service: agent_factory
            dockerfile: services/agent_factory/Dockerfile
            deploy_hook: ""   # paste agent_factory's Render deploy hook URL here
          - service: gateway
            dockerfile: services/gateway/Dockerfile
            deploy_hook: ""   # paste gateway's Render deploy hook URL here
          - service: mail_agent
            dockerfile: services/apps/mail_agent/Dockerfile
            deploy_hook: ""   # paste mail_agent's Render deploy hook URL here
          - service: voice_agent
            dockerfile: services/apps/voice_agent/Dockerfile
            deploy_hook: ""   # paste voice_agent's Render deploy hook URL here
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest

      - name: Trigger Render deploy for ${{ matrix.service }}
        if: matrix.deploy_hook != ''
        run: curl -fsS -X POST "${{ matrix.deploy_hook }}"
